name: Auto-Convert Docs for ChatGPT

on:
  push:
    branches:
      - main  # Runs every time you push changes to the main branch

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    - name: Install conversion libraries
      run: |
        python -m pip install --upgrade pip
        pip install python-docx pandas openpyxl xlrd

    - name: Run conversion script
      run: |
        cat << 'EOF' > convert.py
        import os
        import pandas as pd
        from docx import Document

        def convert_docx_to_md(docx_path, md_path):
            try:
                doc = Document(docx_path)
                with open(md_path, 'w', encoding='utf-8') as f:
                    for para in doc.paragraphs:
                        if para.text.strip():
                            f.write(para.text + '\n\n')
            except Exception as e:
                print(f"Error docx: {e}")

        def convert_xls_to_csv(xls_path, csv_path):
            try:
                df = pd.read_excel(xls_path)
                df.to_csv(csv_path, index=False)
            except Exception as e:
                print(f"Error excel: {e}")

        for filename in os.listdir('.'):
            base, ext = os.path.splitext(filename)
            ext = ext.lower()
            if ext == '.docx':
                convert_docx_to_md(filename, f"{base}.md")
            elif ext in ['.xls', '.xlsx']:
                convert_xls_to_csv(filename, f"{base}.csv")
        EOF
        python convert.py
        rm convert.py

    - name: Commit and push changes back to repo
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add *.md *.csv
        # Only commit if there are actually changes to avoid failing the build
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-converted docs for ChatGPT" && git push)
